<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RSVP · La Calabaza</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0706">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Pinyon+Script&display=swap">
<!-- Página puente para el botón de WhatsApp del PDF.
     Los enlaces wa.me dentro de un PDF a veces abren la web "descarga WhatsApp" en vez de la app;
     esta página abre la app directamente (whatsapp://) y, si el teléfono lo bloquea, ofrece un botón. -->
<style>
:root{--night:#0c0706;--umber:#1a0f0a;--gold:#f2c879;--gold-hi:#fff0c4;--gold-a:rgba(242,200,121,.32);--cream:#f5e6cc;--muted:#c4ab8b;--pumpkin:#FF7518;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(110% 60% at 50% 110%,rgba(255,117,24,.18),transparent 62%),radial-gradient(90% 50% at 0% 0%,rgba(91,39,82,.4),transparent 62%),var(--night);
  color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
main{width:100%;max-width:400px;display:grid;row-gap:18px;justify-items:center}
.pk{width:72px;height:72px;filter:drop-shadow(0 0 14px rgba(255,117,24,.6));-webkit-animation:glow 2.4s ease-in-out infinite;animation:glow 2.4s ease-in-out infinite}
@-webkit-keyframes glow{50%{-webkit-transform:scale(1.06)}}
@keyframes glow{50%{transform:scale(1.06)}}
h1{margin:0;font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400;font-size:52px;line-height:1.05;color:var(--gold)}
p{margin:0}
.status{color:var(--muted);font-style:italic}
.btn{display:-webkit-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:0 22px;border-radius:999px;text-decoration:none;
  font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;touch-action:manipulation}
.btn svg{width:22px;height:22px;margin-right:10px;flex:none}
.btn-primary{color:#2a1002;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 40%,#e48a2e);box-shadow:0 12px 32px -10px rgba(255,117,24,.55),inset 0 0 0 1px rgba(255,255,255,.35)}
.btn-primary:active{-webkit-transform:scale(.97);transform:scale(.97)}
.phone{color:var(--muted);font-size:17px}
.phone span{font-family:'Cinzel',Georgia,serif;color:var(--cream);letter-spacing:.06em;-webkit-user-select:all;user-select:all}
.back{color:var(--gold);font-size:17px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <svg class="pk" viewBox="0 0 64 64" aria-hidden="true">
    <defs><radialGradient id="g" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffb35e"/><stop offset=".55" stop-color="#FF7518"/><stop offset="1" stop-color="#8f3405"/></radialGradient></defs>
    <path d="M31 17c0-6 3-10 8-12" stroke="#3f5a1f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="20" cy="39" rx="14" ry="19" fill="url(#g)"/><ellipse cx="44" cy="39" rx="14" ry="19" fill="url(#g)"/><ellipse cx="32" cy="39" rx="14" ry="21" fill="url(#g)"/>
    <path d="M21 33h7l-3.5-6zM36 33h7l-3.5-6zM30 39h4l-2-3.5zM19 44q13 11 26 0l-4 1-2 3.5-3-3-3 3.5-3-3.5-3 3-2-3.5z" fill="#ffe08a"/>
  </svg>
  <h1 id="t">Confirm your attendance</h1>
  <p class="status" id="st">Opening WhatsApp…</p>
  <a class="btn btn-primary" id="go" href="https://wa.me/13055101484">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
    <span id="gol">Open WhatsApp</span>
  </a>
  <p class="phone">WhatsApp: <span>+1 (305) 510-1484</span></p>
  <a class="back" id="back" href="./#en">See the full invitation</a>
</main>
<script>
(function(){
  "use strict";
  var PHONE = "13055101484";
  var MSG = {
    es: "¡Hola! 🎃 Confirmo mi asistencia a la Fiesta de La Calabaza el sábado 24 de octubre a las 6:00 PM en Braford Marine. Mi nombre es: ",
    en: "Hi! 🎃 I'm confirming my attendance at La Calabaza Party on Saturday, October 24 at 6:00 PM at Braford Marine. My name is: "
  };
  var TXT = {
    es: { t: "Confirma tu asistencia", st: "Abriendo WhatsApp…", st2: "Si WhatsApp no se abrió, toca el botón:", go: "Abrir WhatsApp", back: "Ver la invitación completa" },
    en: { t: "Confirm your attendance", st: "Opening WhatsApp…", st2: "If WhatsApp didn't open, tap the button:", go: "Open WhatsApp", back: "See the full invitation" }
  };
  // idioma: rsvp.html#es o rsvp.html#en (por defecto inglés, como el PDF)
  var lang = (location.hash || "").replace("#", "").toLowerCase() === "es" ? "es" : "en";
  var tx = TXT[lang], $ = function(id){ return document.getElementById(id); };
  document.documentElement.lang = lang;
  $("t").textContent = tx.t; $("st").textContent = tx.st; $("gol").textContent = tx.go;
  $("back").textContent = tx.back; $("back").href = "./#" + lang;

  var q = "phone=" + PHONE + "&text=" + encodeURIComponent(MSG[lang]);
  var APP = "whatsapp://send?" + q, WEB = "https://api.whatsapp.com/send?" + q;
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  $("go").href = isMobile ? APP : "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(MSG[lang]);

  function openApp(withFallback){
    var left = false;
    function gone(){ left = true; }
    document.addEventListener("visibilitychange", gone); window.addEventListener("pagehide", gone); window.addEventListener("blur", gone);
    window.location.href = APP;
    setTimeout(function(){
      document.removeEventListener("visibilitychange", gone); window.removeEventListener("pagehide", gone); window.removeEventListener("blur", gone);
      if (left || document.hidden) return;
      if (withFallback) window.location.href = WEB;                // sin app instalada: web de WhatsApp
      else $("st").textContent = tx.st2;                           // el teléfono bloqueó la apertura automática
    }, 1600);
  }
  if (isMobile){
    $("go").addEventListener("click", function(e){ e.preventDefault(); openApp(true); });
    // intento automático cuando la página ya se pintó (evita dejarla a medio cargar)
    if (document.readyState === "complete") setTimeout(function(){ openApp(false); }, 250);
    else window.addEventListener("load", function(){ setTimeout(function(){ openApp(false); }, 250); });
  } else {
    $("st").textContent = tx.st2;
  }
})();
</script>
</body>
</html>
